<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        function deleteBanner(bannerId) {
            if (confirm("정말로 삭제하시겠습니까?")) {
                var token = $("meta[name='_csrf']").attr("content");
                var header = $("meta[name='_csrf_header']").attr("content");

                $.ajax({
                    url: '/admin/banner/' + bannerId,
                    type: 'DELETE',
                    beforeSend: function(xhr) {
                        xhr.setRequestHeader(header, token);
                    },
                    success: function(result) {
                        alert("배너가 삭제되었습니다.");
                        location.href = '/admin/banner/list';
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        alert("배너 삭제 중 오류가 발생했습니다.");
                    }
                });
            }
        }
    </script>
</th:block>

<th:block layout:fragment="css">
    <style>
        .admin-container {
     background-color: #f8f8f8; /* 배경색 변경 */
     color: #333; /* 기본 폰트 색상 변경 */
     padding: 2rem;
     min-height: 100vh;
 }

 .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
 .admin-title {
     font-size: 2rem;
     font-weight: bold;
     color: #b60217; /* 타이틀 폰트 색상 변경 */
 }
 .add-content-btn {
     background-color: #b60217; /* 버튼 색상 변경 */
     color: white;
     border: none;
     padding: 0.8rem 1.5rem;
     border-radius: 4px;
     font-weight: bold;
     transition: background-color 0.3s;
 }
 .add-content-btn:hover {
     background-color: #950113; /* 버튼 호버 색상 변경 */
     color: white;
     text-decoration: none;
 }
 .content-table {
     background-color: white; /* 테이블 배경색을 흰색으로 변경 */
     border-radius: 8px;
     overflow: hidden;
     border: 1px solid rgba(106, 13, 173, 0.3);
 }
 .table {
     color: #333; /* 테이블 폰트 색상 변경 */
     margin-bottom: 0;
 }
 .table thead {
     background-color: #e0e0e0; /* 테이블 헤더 배경색 변경 */
 }
 .table thead th {
     color: #b60217; /* 테이블 헤더 폰트 색상 변경 */
     font-weight: bold;
     background-color: #ead48e;
 }
 .table td, .table th {
     border-color: rgba(106, 13, 173, 0.2);
     vertical-align: middle;
     text-align: center;
     padding: 1rem;
     background-color: white; /* 테이블 셀 배경 흰색으로 변경 */
     color: #333; /* 테이블 폰트 색상 변경 */
 }
 .table tbody tr:hover {
     background-color: #f0f0f0 !important; /* 테이블 호버 색상 변경 */
 }
 .action-btn img {
     filter: none;
     opacity: 0.9;
     width: 24px;
     height: 24px;
 }
 .action-btn:hover img {
     opacity: 1;
     filter: sepia(1) saturate(5) hue-rotate(0deg);
 }
    </style>
</th:block>

<div layout:fragment="content" class="admin-container">
    <div class="admin-header">
        <h1 class="admin-title">배너 관리</h1>
        <a href="/admin/banner" class="add-content-btn">
            <i class="fas fa-plus"></i> 새 배너 추가
        </a>
    </div>

    <div class="content-table">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>이미지</th>
                    <th>제목</th>
                    <th>설명</th>
                    <th>등록일</th>
                    <th>수정일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="bannerDto : ${bannerDtoList}">
                    <td th:text="${bannerDto.id}"></td>
                    <td>
                        <img th:if="${bannerDto?.imgUrl != null}" 
                             th:src="@{${bannerDto.imgUrl}}"
                             width="100" height="130">
                    </td>
                    <td th:text="${bannerDto.title}"></td>
                    <td th:text="${bannerDto.description}"></td>
                    <td th:text="${#temporals.format(bannerDto.regTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${bannerDto.regTime != bannerDto.updateTime ? #temporals.format(bannerDto.updateTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{'/admin/banner/' + ${bannerDto.id} + '/modify'}" class="action-btn">
                                <img src="/img/correction_btn.png" alt="수정" title="수정">
                            </a>
                            <button type="button" class="action-btn" th:onclick="'deleteBanner(' + ${bannerDto.id} + ')'">
                                <img src="/img/delete_btn.png" alt="삭제" title="삭제">
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</html>
