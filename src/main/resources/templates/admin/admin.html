<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

    <th:block layout:fragment="css">
        <style>
            body {
                background-color: #f8f8f8;
            }

            .admin-container {
                max-width: 1200px;
                margin: 50px auto;
                padding: 20px;
                background-color: #fff; /* 배경색을 흰색으로 유지 */
            }

            .stats-card {
                background: #fff;
                border-radius: 10px;
                padding: 20px;
                margin-bottom: 20px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            .stats-title {
                font-size: 18px;
                color: #333;
                margin-bottom: 15px;
                font-weight: 600;
            }

            .stats-number {
                font-size: 32px;
                color: #333; /* 폰트 색상 변경 */
                font-weight: bold;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }

            .chart-container {
                background: #fff;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            .small-text {
                font-size: 14px;
                color: #666;
                margin-top: 5px;
            }

            .btn {
                background-color: #b60217; /* 버튼 기본 색상 */
                color: #fff;
                padding: 10px 20px;
                border-radius: 5px;
                text-decoration: none;
                display: inline-block;
            }

            .btn:hover {
                background-color: #950113; /* 버튼 호버 색상 */
            }

            @media (max-width: 768px) {
                .stats-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </th:block>

<div layout:fragment="content">
    <div class="admin-container">
        <h2 class="mb-4">관리자 대시보드</h2>

        <div class="dashboard-header">
            <div class="header-buttons">
                <a href="/admin/download" class="btn btn-primary me-2">엑셀 다운로드</a>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-title">오늘 방문자 수</div>
                <div class="stats-number" th:text="${todayVisitors}">0</div>
                <div class="small-text">Today's Visitors</div>
            </div>
            
            <div class="stats-card">
                <div class="stats-title">총 방문자 수</div>
                <div class="stats-number" th:text="${totalVisitors}">0</div>
                <div class="small-text">Total Visitors</div>
            </div>
            
            <div class="stats-card">
                <div class="stats-title">이번 달 방문자 수</div>
                <div class="stats-number" th:text="${monthlyVisitors}">0</div>
                <div class="small-text">Monthly Visitors</div>
            </div>
        </div>
        
        <div class="chart-container">`
            <canvas id="visitorChart"></canvas>
        </div>
    </div>
    
    <script th:inline="javascript">
        // 방문자 데이터
        const dailyStats = /*[[${recentDailyStats}]]*/ {};
        
        // 데이터가 존재하는지 확인
        if (dailyStats && Object.keys(dailyStats).length > 0) {
            const ctx = document.getElementById('visitorChart');
            if (ctx) {  // canvas 엘리먼트가 존재하는지 확인
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Object.keys(dailyStats).reverse(),
                        datasets: [{
                            label: '일일 방문자 수',
                            data: Object.values(dailyStats).reverse(),
                            borderColor: '#2c3e50',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: '최근 7일 방문자 통계'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } else {
                console.error('Canvas element not found');
            }
        } else {
            console.error('No data available');
        }
    </script>
</div>
</html>
