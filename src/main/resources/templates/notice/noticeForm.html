<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>



<th:block layout:fragment="css">
  <style>
    body {
 background-color: #f8f8f8; /* 배경색 변경 */
 min-height: 100vh;
 position: relative;
}



.container {
 max-width: 900px;
 padding: 40px;
 background: #fff; /* 컨테이너 배경색 변경 */
 color: #333; /* 폰트 색상 변경 */
 border-radius: 12px;
 margin-top: 30px;
 margin-bottom: 30px;
 backdrop-filter: blur(10px);
 position: relative;
 overflow: visible;
}



.form-control {
 background: white;
 border: 1px solid #ead48e; /* 입력 필드 테두리 색 변경 */
 color: #333;
 transition: all 0.3s ease;
 width: 100%;
 height: 37px;
}

.form-control:focus {
 background: rgba(250, 250, 250, 0.9);
 color: #333;
 box-shadow: 0 0 0 2px #ead48e;
}

/* 버튼 스타일 변경 */
.btn {
 background: #b60217; /* 버튼 색상 변경 */
 margin: 10px;
 border: none;
 padding: 12px 40px;
 font-weight: 600;
 font-size: 16px;
 margin-top: 20px;
 transition: all 0.3s ease;
 color: white;
 box-shadow: 0 4px 15px rgba(182, 2, 23, 0.2);
}

.btn:hover {
 background: #950113; /* 버튼 호버 색상 변경 */
 transform: translateY(-2px);
 box-shadow: 0 6px 20px rgba(149, 1, 19, 0.3);
}

h2 {
 text-align: center;
 font-weight : 800;
 color: #333; /* 제목 폰트 색 변경 */
 margin-bottom: 40px;
 position: relative;
 padding-bottom: 20px;
}

h2::after {
 content: '';
 position: absolute;
 bottom: 0;
 left: 0;
 width: 100%;
 height: 3px;
 background: linear-gradient(to right, #b60217, transparent);
}



/* 입력 그룹 스타일 */
.input-group-text, .image-input-group-text {
 background: #f8f8f8;
 color: #333;
 border: 1px solid #ead48e; /* 입력 그룹 테두리 색 변경 */
 height: 10px;
 min-width: 120px;
 font-weight: 500;
 display: flex;
 align-items: center;
 height: 45px;
 text-transform: uppercase;
 font-size: 0.9em;
 letter-spacing: 0.5px;
}

.input-group.mb3 .form-control::file-selector-button {
 background: #f8f8f8;
 color: #333;
 border: 1px solid #ead48e; /* 파일 업로드 버튼 테두리 색 변경 */
}

form-control::file-selector-button:hover {
 background: #ead48e;
}
label{
font-weight : 600;
margin : 10px 0;}

.text-danger {
 color: #b60217 !important;
 font-size: 0.9em;
 margin-top: 5px;
}

    .form-group{
    margin : 10px;
    }



  </style>
</th:block>

<div layout:fragment="content">
  <div class="container my-5">
    <div class="row">
      <div class="col-12">
        <h2 class="mb-4">공지사항 업로드</h2>

        <form action="/admin/notice/new" method="post" enctype="multipart/form-data" th:object="${noticeDto}">
          <input type="hidden" th:field="*{id}">
          <div class="form-group">
            <label th:for="title">제목</label>
            <input type="text" th:field="*{title}" class="form-control" required>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="fieldError">Incorrect data</p>
          </div>

          <div class="form-group">
            <label th:for="description">설명</label>
            <input type="text" th:field="*{description}" class="form-control" required>
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="fieldError">Incorrect data</p>
          </div>

          <div class="form-group">
            <label for="noticeImgFile">이미지</label>
            <input type="file" id="noticeImgFile" name="noticeImgFile" class="form-control"
                   accept="image/*" th:required="${#strings.isEmpty(id)}">
          </div>

          <p th:if="${errorMessage}" class="fieldError" th:text="${errorMessage}"></p>

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-primary">등록</button>
          <div th:unless="${#strings.isEmpty(id)}" style="text-align: center">
            <button th:formaction="@{'/admin/notice/' + ${noticeDto.id} + '/modify'}" type="submit" class="btn btn-primary">수정</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script th:inline="javascript">

    $(document).ready(function(){
    bindDomEvent();
    });

    function bindDomEvent(){
    $("#noticeImgFile").on("change", function(){
    var fileName = $(this).val().split("\\").pop();
    var fileExt = fileName.substring(fileName.lastIndexOf(".")+1);
    fileExt = fileExt.toLowerCase();

    if(fileExt != "jpg" && fileExt != "jpeg" && fileExt != "gif"
    && fileExt != "png" && fileExt != "bmp"){
    alert("이미지 파일만 등록이 가능합니다.");
    $(this).val("");
    return;
    }

    // 이미지 크기 체크
    // var file = this.files[0];
    // var _URL = window.URL || window.webkitURL;
    // var img = new Image();

    // img.onload = function() {
    //     if(this.width !== 1389 || this.height !== 600) {
    //         alert("이미지 크기는 1389x600 픽셀이어야 합니다.");
    //         $("#bannerImgFile").val("");
    //     }
    // };
    img.src = _URL.createObjectURL(file);
    });
    }
  </script>
  </th:block>
</div>
</html>
