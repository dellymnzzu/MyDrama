<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>로그인</title>
</head>

<th:block layout:fragment="css">
    <style>
        .form-container {
            max-width: 420px;
            margin: 100px auto;
            padding: 0 20px;
        }
        
        .form-box {
            background: #fff;
            padding: 60px 20px;
        }
        
        .form-box h2 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 28px;
            font-weight: 600;
            color: #333333;
        }
        
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        
        .form-control {
            width: 100%;
            height: 55px;
            padding: 0 10px;
            border: 1px solid #e5e5e5;
            font-size: 14px;
            border-radius: 0;
            background: #ffffff;
        }
        
        .form-control::placeholder {
            color: #999999;
            font-size: 13px;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #333333;
            background: #fff;
        }
        
        .btn-primary {
            width: 100%;
            height: 54px;
            background: #b60217;
            color: #ffffff;
            border: none;
            font-size: 16px;
            font-weight: 400;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background: #6b020e;
        }
        
        .login-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .login-buttons img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 0px 4px 6px #255,242,205;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid #fdf9ef;;
        }

        .login-buttons img:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.6);
        }
        
        #btnFindId {
            display: block;
            text-align: center;
            color: #666666;
            text-decoration: none;
            margin-top: 15px;
            font-size: 13px;
        }
        
        #btnFindId:hover {
            color: #333333;
        }
        
        .error {
            color: #ff4a4a;
            font-size: 13px;
            margin: 5px 0;
            text-align: center;
        }
        
        hr {
            display: none;
        }
        
        .mt-4 {
            margin-top: 20px;
        }
        
        .btn {
            border-radius: 0;
        }
        
        .login-buttons .btn {
            padding: 0;
            background: none;
        }
            
        @media (max-width: 480px) {
            .form-container {
                margin: 50px auto;
            }
            
            .form-box {
                padding: 40px 15px;
            }
            
            .form-box h2 {
                font-size: 24px;
                margin-bottom: 40px;
            }
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="form-container">
        <div class="form-box">
            <form action="/member/signin" role="form" method="post">
                <div class="form-group">
                    <!--아이디-->
                    <input type="text" name="userId" class="form-control" placeholder="아이디">
                    <hr>
                </div>
                <div class="form-group">
                    <!--비밀번호-->
                    <input type="password" name="password" class="form-control" placeholder="비밀번호(영문대/소문자,숫자,특수문자 중 2가지 이상 조합하세요.)">
                    <hr>
                </div>

                <div class="mt-4">
                    <p th:if="${loginErrorMsg}" class="error" th:text="${loginErrorMsg}"></p>
                    <button class="btn btn-primary w-100 mb-2">로그인</button>
                    <button type="button" class="btn btn-primary w-100" onclick="location.href='/member/signup'">회원가입</button>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <span>
                        <a id="btnFindId" href="/member/findEmail">아이디/비밀번호 찾기</a>
                    </span>
                </div>
            </form>

            <div class="login-buttons">
                <a href="/oauth2/authorization/naver" class="btn naver">
                    <img src="/img/logo/naver-logo.png" alt="Naver Logo">
                </a>
                <a href="/oauth2/authorization/kakao" class="btn kakao">
                    <img src="/img/logo/kakao-logo.png" alt="Kakao Logo">
                </a>
                <a href="/oauth2/authorization/google" class="btn google">
                    <img src="/img/logo/google-logo.png" alt="Google Logo">
                </a>
            </div>
        </div>
    </div>
</div>

</html>
