<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<div layout:fragment="content">
  <h1>메인페이지입니다.</h1>
  <div th:if="${mainDto != null}">
    <p th:text="'환영합니다, ' + ${mainDto.userId} + '님'"></p>
  </div>
  <a class="dropdown-item" href="/member/mypage">마이페이지</a>
  <a class="dropdown-item" href="/member/signin">로그인</a>
  <a class="chat-icon" href="/chatbot">챗봇</a>
  <a class="chat-icon" href="/member/findPassword">비밀번호찾기</a>
  <a class="chat-icon" href="/member/findEmail">이메일찾기</a>
  <a class="chat-icon" href="/about/map">지도맵</a>
  <a class="chat-icon" href="/admin">관리자 페이지지</a>
  <button id="chatButton" class="icon headset-icon">채팅 클릭</button>
</div>

<script type="text/javascript" src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
    var roomId = /*[[${mainDto?.id}]]*/ null;  // mainDto가 null일 수 있으므로 안전한 접근
    console.log("memberId: " + roomId);

    const chatButton = document.getElementById('chatButton');
    if (chatButton) {
        chatButton.addEventListener('click', function() {
            if (!roomId) {
                alert('로그인이 필요합니다.');
                window.location.href = '/member/signin';
                return;
            }

            const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
            const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

            // 서버에 전송할 데이터 준비
            const data = { memberId: roomId };
            
            // 채팅방 생성 API 호출
            fetch('/create-room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [header]: token
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text);
                    });
                }
                return response.json();
            })
            .then(roomId => {
                const screenWidth = window.screen.width;
                const windowWidth = 400;
                const windowHeight = 600;
                const left = screenWidth - windowWidth;
                window.open('/chat/' + roomId, '_blank', 
                    `width=${windowWidth},height=${windowHeight},left=${left},top=100`);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('채팅방 생성에 실패했습니다.');
            });
        });
    }

    const chatIcon = document.querySelector('.chat-icon');
    if (chatIcon) {
        chatIcon.addEventListener('click', function(e) {
            e.preventDefault();
            // 화면 오른쪽에 새 창 열기 (채팅 창 위에 위치)
            const screenWidth = window.screen.width;
            const windowWidth = 400;
            const windowHeight = 600;
            const left = screenWidth - windowWidth;
            window.open('/chatbot', '_blank', `width=${windowWidth},height=${windowHeight},left=${left},top=100,location=no,menubar=no,status=no,toolbar=no`);
        });
    }
});
</script>
</body>
</html>
