<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>문의하기</title>
      </head>
      <th:block layout:fragment="css">
          <style>
              /* 전체 배경 및 기본 글꼴 색상 */
              body {
                  background-color: #f8f8f8;
                  color: #333;
                  font-family: 'Noto Sans KR', sans-serif;
              }
              .my-5{
              border : 1px solid #fff;
              background-color: #fff;
               border-radius: 5px;
              }

              /* 입력 필드 스타일 */
              .form-control {
                  color: #444;
                  background-color: #fff;
                  border: 1px solid #ccc;
                  border-radius: 5px;
                  padding: 10px;
              }

              .form-control:focus {
                  border-color: #b60217;
                  box-shadow: 0 0 5px rgba(182, 2, 23, 0.5);
                  outline: none;
              }

              /* 버튼 스타일 */
              .btn-primary {
                  background-color: #b60217;
                  border-color: #b60217;
                  color: #fff;
                  font-weight: bold;
                  border-radius: 5px;
                  transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
              }

              .btn-primary:hover {
                  background-color: #950113;
                  border-color: #950113;
                  transform: scale(1.05);
              }

              /* 취소(목록으로) 버튼 스타일 */
              .btn-secondary {
                  background-color: #ead48e;
                  border-color: #ead48e;
                  color: #fff;
                  font-weight: bold;
                  border-radius: 5px;
                  transition: background-color 0.3s ease-in-out;
              }



              /* 제목 스타일 */
              h2 {
                  font-weight: bold;
                  color: #b60217;
              }

              /* 오류 메시지 스타일 */
              .alert-danger {
                  font-size: 0.9rem;
                  padding: 8px;
                  border-radius: 5px;
              }

              label{
              font-weight:700;
              }

          </style>
      </th:block>

<div layout:fragment="content">
    <div class="container my-5">
        <h2 class="mb-4">문의하기</h2>
        <form th:action="@{/qna/create}" method="post" th:object="${questionForm}">
            <div class="form-group mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
                <div class="alert alert-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea class="form-control" id="content" th:field="*{content}" rows="10" required></textarea>
                <div class="alert alert-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary me-md-2">등록하기</button>
                <a th:href="@{/qna/list}" class="btn btn-secondary">목록으로</a>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        </form>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        $(document).ready(function() {
            const errorMessage = [[${errorMessage}]];
            if (errorMessage) {
                alert(errorMessage);
            }
        });
    </script>
</th:block>

</html>
