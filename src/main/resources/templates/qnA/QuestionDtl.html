<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<th:block layout:fragment="css">
    <style>
        /* 전체 배경 및 기본 글꼴 스타일 */
body {
    background-color: #f8f8f8;
    color: #333;
    font-family: 'Noto Sans KR', sans-serif;
}

/* 카드 스타일 */
.card {
    border-radius: 8px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    background-color: #fff;
}

/* 카드 헤더 스타일 */
.card-header {
    background-color: #ead48e; /* 서브 컬러 적용 */
    color: #333;
    font-weight: bold;
}

/* 상태 배지 (답변대기/완료) */
.badge {
    font-size: 0.9rem;
    padding: 5px 10px;
}

.bg-warning {
    background-color: #b60217 !important;
    color: #fff;
}

.bg-success {
    background-color: #28a745 !important;
    color: #fff;
}

/* 입력 필드 스타일 */
.form-control {
    color: #333;
    background-color: #fff;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 10px;
}

.form-control:focus {
    border-color: #b60217;
    box-shadow: 0 0 5px rgba(182, 2, 23, 0.5);
    outline: none;
}

/* 버튼 스타일 */
.btn-primary {
    background-color: #b60217;
    border-color: #b60217;
    color: #fff;
    font-weight: bold;
    border-radius: 5px;
    transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
}

.btn-primary:hover {
    background-color: #950113;
    border-color: #950113;
    transform: scale(1.05);
}

/* 목록으로 버튼 스타일 */
.btn-secondary {
    background-color: #333;
    border-color: #333;
    color: #fff;
    font-weight: bold;
    border-radius: 5px;
    transition: background-color 0.3s ease-in-out;
}

.btn-secondary:hover {
    background-color: #555;
    border-color: #555;
}

/* 질문 내용 섹션 */
.question-content h5 {
    color: #b60217;
    font-weight: bold;
}

/* 답변 입력 폼 */
.answer-form textarea {
    border: 1px solid #ead48e;
    background-color: #fffaf0;
}

/* 답변 카드 스타일 */
.answer-content .card {
    border: 1px solid #ead48e;
    background-color: #fffaf0;
}

        .badge{
        background-color:#b60217;
        color:#fff;
        }


    </style>
</th:block>


<div layout:fragment="content">
    <div class="container my-5">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0" th:text="${question.title}"></h3>
                <div>
                    <span class="badge" 
                          th:classappend="${question.status.name() == 'WAITING'} ? 'bg-warning' : 'bg-success'"
                          th:text="${question.status.name() == 'WAITING'} ? '답변대기' : '답변완료'">
                    </span>
                </div>
            </div>
            
            <div class="card-body">
                <div class="mb-4">
                    <small class="text-muted">
                        작성자: <span th:text="${question.memberName}"></span> |
                        작성일: <span th:text="${#temporals.format(question.createdTime, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                
                <!-- 질문 내용 -->
                <div class="question-content mb-5">
                    <h5 class="card-title">질문 내용</h5>
                    <p class="card-text" th:text="${question.content}"></p>
                </div>

                <!-- 답변 영역 -->
                <div class="answer-section mt-5">
                    <h5 class="card-title">답변</h5>
                    
                    <!-- 답변이 없고 관리자인 경우 답변 작성 폼 표시 -->
                    <div th:if="${question.status.name() == 'WAITING'}" 
                         sec:authorize="hasRole('ADMIN')" 
                         class="answer-form mb-4">
                        <form id="answerForm">
                            <div class="form-group">
                                <textarea class="form-control" id="answerContent" rows="5" 
                                          placeholder="답변을 입력하세요"></textarea>
                            </div>
                            <button type="button" class="btn btn-primary mt-3" 
                                    th:onclick="submitAnswer([[${question.id}]])">답변등록</button>
                        </form>
                    </div>

                    <!-- 답변이 있는 경우 답변 내용 표시 -->
                    <div th:if="${question.status.name() == 'COMPLETED'}" class="answer-content">
                        <div class="card">
                            <div class="card-body">
                                <p class="card-text" th:text="${answer?.content}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card-footer">
                <a th:href="@{/qna/list}" class="btn btn-secondary">목록으로</a>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        function submitAnswer(questionId) {
            const token = $("meta[name='_csrf']").attr("content");
            const header = $("meta[name='_csrf_header']").attr("content");
            
            const content = $("#answerContent").val();
            if (!content.trim()) {
                alert("답변 내용을 입력해주세요.");
                return;
            }

            $.ajax({
                url: `/admin/qna/answer/${questionId}`,
                type: 'POST',
                data: { content: content },
                beforeSend: function(xhr) {
                    xhr.setRequestHeader(header, token);
                },
                success: function(response) {
                    alert(response);
                    location.reload();
                },
                error: function(error) {
                    alert("답변 등록에 실패했습니다.");
                }
            });
        }
    </script>
</th:block>

</html>
