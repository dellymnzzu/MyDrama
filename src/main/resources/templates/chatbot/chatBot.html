<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      >
<head>
    <meta charset="UTF-8">
    <title>AI Chatbot</title>
    <style>
        body{
                    background-color: #EAD495;

                }
                .chat-container {
                    max-width: 600px;
                    margin: 0 auto;
                    padding: 20px;
                    background-color: #EAD495;
                    color: white;
                }
                .chat-box {
                    height: 450px;
                    overflow-y: auto;
                    border: 1px solid #333;
                    padding: 10px;
                    margin-bottom: 20px;
                    background-color: #f8f8f8;
                }
                .message {
                    margin: 10px 0;
                    padding: 10px;
                    border-radius: 5px;
                }
                .user-message {
                    background-color: #b60217;
                    margin-left: 20%;
                }
                .bot-message {
                    background-color: #ead48e;
                    margin-right: 20%;
                }
                .input-container {
                    display: flex;
                    gap: 10px;
                }
                input {
                    flex: 1;
                    padding: 10px;
                    background-color: #fff;
                    color: black;
                    border: none;
                    border-radius: 5px;
                }
                button {
                    padding: 10px 20px;
                    background-color: #b60217;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                }
                button:hover {
                    background: rgba(105, 13, 171, 0.7);
                }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

    <div class="chat-container">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="질문을 입력하세요...">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>
<script>
    window.onload = function() {
        appendMessage('bot', '환영합니다! 무엇을 도와드릴까요?');
    }
    function sendMessage() {
        const input = document.getElementById('userInput');
        const message = input.value.trim();

        if (!message) return;

        appendMessage('user', message);
        input.value = '';

        const token = document.querySelector("meta[name='_csrf']").content;
        const header = document.querySelector("meta[name='_csrf_header']").content;

        fetch('/chatbot/query', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [header]: token
            },
            body: JSON.stringify({ question: message })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            if (data.type === 'faq') {
                appendMessage('bot', data.answer);
            } else {
                appendMessage('bot', data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            appendMessage('bot', '죄송합니다. 오류가 발생했습니다.');
        });
    }
    function appendMessage(type, message) {
        const chatBox = document.getElementById('chatBox');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}-message`;
        messageDiv.textContent = message;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</html>
